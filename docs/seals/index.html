<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal generator | Chunom.org</title>
  <meta name="description" content="Make a seal (印章) of Chữ Nôm characters in the fonts of chunom.org and download it as a PNG.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://qatt.org/css/site.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <script src="https://qatt.org/js/navigation.js"></script>
  <script defer src="/chunom/js/ime.js"></script>
  <script defer src="/apps/seals/seal.js"></script>
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    /* the header of the pages of qatt.org and the Chunom site (.hero): the look of the theme "classic"; other themes override it */
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    @media (max-width: 575.98px) {
      .hero { padding-top: 1rem !important; padding-bottom: .6rem !important; margin-bottom: .8rem !important; }
      .hero .han { letter-spacing: .3em; margin-bottom: .2rem !important; }
      .hero h1 { margin-bottom: 0 !important; }
      .hero .lead { display: none; }
    }
    main { max-width: 34rem; margin: 0 auto; padding: 0 .75rem 2rem; }

    /* one card: the field, the seal, the settings, the sliders */
    .card-box { padding: .75rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    .part + .part { margin-top: .75rem; }
    .part.ruled { padding-top: .75rem; border-top: 1px solid var(--line); }

    /* the field: centred above the seal, so that the candidate list of ime.js opens over the seal */
    #text { font-size: 1.8rem; text-align: center; letter-spacing: .1em; }
    #text::placeholder { font-size: 1rem; letter-spacing: normal; vertical-align: middle; }
    .filler { gap: .4rem; cursor: pointer; }
    .filler .form-check-input { margin: 0; cursor: pointer; }

    /* the seal on rice paper (in every theme: black ink must stay visible in a dark theme), its two buttons in the lower right corner */
    .stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 12rem; padding: .75rem .75rem 3.2rem; border-radius: .5rem;
      background-color: #faf7f2; background-image: radial-gradient(#e5dec9 1px, transparent 1px); background-size: 16px 16px; }
    .stage canvas { display: block; width: 100%; max-width: 16rem; height: auto; max-height: 24rem; object-fit: contain; }
    .stage .tools { position: absolute; right: .5rem; bottom: .5rem; display: flex; gap: .4rem; }
    .stage .tools .btn { white-space: nowrap; }

    /* the settings */
    .cap { display: block; margin-bottom: .25rem; font-size: .75rem; font-weight: 600; color: var(--muted); }
    .opts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem 1.25rem; }
    .opts .btn-group .btn { min-width: 2.6rem; }
    .opts .han { font-family: var(--font-cjk), serif; font-size: 1.05rem; line-height: 1.2; font-style: normal; text-transform: none; letter-spacing: normal; }
    .btn-check:checked + .btn-quiet { --bs-btn-active-bg: color-mix(in srgb, var(--accent) 14%, transparent); --bs-btn-active-border-color: var(--accent); --bs-btn-active-color: var(--accent); }
    .swatches { display: flex; gap: .45rem; padding: .2rem 0; }
    .swatch { display: inline-block; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); cursor: pointer; }
    .btn-check:checked + .swatch { outline: 2px solid var(--ink); outline-offset: 2px; }
    .btn-check:focus-visible + .swatch { outline: 2px dashed var(--accent); outline-offset: 2px; }

    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: .1rem 1.25rem; }
    .sliders label { display: flex; justify-content: space-between; font-size: .75rem; font-weight: 600; color: var(--muted); }
    .sliders output { font-weight: 400; }
    .form-range::-webkit-slider-thumb { background: var(--accent); }
    .form-range::-moz-range-thumb { background: var(--accent); }
  </style>
</head>
<body>

<header class="hero pt-4 pb-3 mb-3">
  <div class="container text-center">
    <div class="han mb-1">印章</div>
    <h1 class="mb-2" data-vi="Tạo con dấu">Seal generator</h1>
    <p class="lead mx-auto mb-0" data-vi="Khắc một con dấu bằng chữ Nôm và tải nó về dưới dạng PNG.">Carve a seal of Chữ Nôm characters and download it as a PNG.</p>
  </div>
</header>

<main>
  <div class="card-box">
    <!-- the characters: Telex and the candidates of js/ime.js; a space between two characters is an empty cell -->
    <div class="part">
      <label for="text" class="visually-hidden" data-vi="Chữ trên con dấu">Characters of the seal</label>
      <div class="input-group" id="text-group">
        <input id="text" type="text" class="form-control" value="𡦂喃麪𢶒" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Type Vietnamese, pick the Nôm" data-vi-placeholder="Gõ tiếng Việt, chọn chữ Nôm"
               title="Telex; a space between two characters leaves a cell empty" data-vi-title="Telex; dấu cách giữa hai chữ để trống một ô">
        <label class="input-group-text filler" id="filler-box" title="Fill an odd number with 印" data-vi-title="Thêm 印 khi số chữ lẻ">
          <input class="form-check-input" type="checkbox" id="filler" checked><span class="han">印</span>
        </label>
      </div>
    </div>

    <!-- the seal -->
    <div class="part">
      <div class="stage">
        <canvas id="seal" width="600" height="600" role="img" aria-label="Seal" data-vi-aria-label="Con dấu"></canvas>
        <div class="tools">
          <button id="reroll" type="button" class="btn btn-quiet btn-pill btn-sm" title="New worn edges" data-vi-title="Vết mép mới"><i class="bi bi-shuffle"></i><span class="visually-hidden" data-vi="Vết mép mới">New worn edges</span></button>
          <button id="download" type="button" class="btn btn-cinnabar btn-pill btn-sm"><i class="bi bi-download"></i> <span>PNG</span></button>
        </div>
      </div>
    </div>

    <!-- font, carving, reading order, ink -->
    <div class="part ruled">
      <span class="cap" id="font-cap" data-vi="Phông chữ">Font</span>
      <div class="input-group" role="group" aria-labelledby="font-cap">
        <button id="font-prev" type="button" class="btn btn-quiet" title="Previous font" data-vi-title="Phông trước"><i class="bi bi-chevron-left"></i></button>
        <select id="font" class="form-select text-center" aria-labelledby="font-cap"></select>
        <button id="font-next" type="button" class="btn btn-quiet" title="Next font" data-vi-title="Phông sau"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>
    <div class="part opts">
      <div>
        <span class="cap" id="style-cap" data-vi="Kiểu khắc">Carving</span>
        <div class="btn-group" role="radiogroup" aria-labelledby="style-cap">
          <input type="radio" class="btn-check" name="style" id="style-relief" value="relief" checked>
          <label class="btn btn-quiet btn-sm" for="style-relief" title="Red characters (朱文)" data-vi-title="Chữ đỏ (chu văn)"><span class="han">朱</span></label>
          <input type="radio" class="btn-check" name="style" id="style-intaglio" value="intaglio">
          <label class="btn btn-quiet btn-sm" for="style-intaglio" title="White characters (白文)" data-vi-title="Chữ trắng (bạch văn)"><span class="han">白</span></label>
        </div>
      </div>
      <div>
        <span class="cap" id="order-cap" data-vi="Thứ tự đọc">Reading</span>
        <div class="btn-group" role="radiogroup" aria-labelledby="order-cap">
          <input type="radio" class="btn-check" name="order" id="order-col" value="columns" checked>
          <label class="btn btn-quiet btn-sm" for="order-col" title="In columns, from the right" data-vi-title="Theo cột, từ phải"><i class="bi bi-arrow-down"></i><span class="visually-hidden" data-vi="Theo cột">Columns</span></label>
          <input type="radio" class="btn-check" name="order" id="order-row" value="rows">
          <label class="btn btn-quiet btn-sm" for="order-row" title="In rows, from the left" data-vi-title="Theo hàng, từ trái"><i class="bi bi-arrow-right"></i><span class="visually-hidden" data-vi="Theo hàng">Rows</span></label>
        </div>
      </div>
      <div>
        <span class="cap" id="ink-cap" data-vi="Màu mực">Ink</span>
        <div class="swatches" role="radiogroup" aria-labelledby="ink-cap">
          <input type="radio" class="btn-check" name="ink" id="ink-1" value="#c8281e" checked><label class="swatch" style="--c: #c8281e" for="ink-1" title="Cinnabar" data-vi-title="Chu sa"><span class="visually-hidden" data-vi="Chu sa">Cinnabar</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-2" value="#a81c14"><label class="swatch" style="--c: #a81c14" for="ink-2" title="Carmine" data-vi-title="Đỏ thẫm"><span class="visually-hidden" data-vi="Đỏ thẫm">Carmine</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-3" value="#d9381e"><label class="swatch" style="--c: #d9381e" for="ink-3" title="Vermilion" data-vi-title="Đỏ son"><span class="visually-hidden" data-vi="Đỏ son">Vermilion</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-4" value="#1f2937"><label class="swatch" style="--c: #1f2937" for="ink-4" title="Black" data-vi-title="Đen"><span class="visually-hidden" data-vi="Đen">Black</span></label>
        </div>
      </div>
    </div>

    <!-- the sliders -->
    <div class="part ruled sliders">
      <div>
        <label for="scale"><span data-vi="Cỡ chữ">Character size</span><output id="scale-out" for="scale"></output></label>
        <input id="scale" type="range" class="form-range" min="65" max="115" value="100">
      </div>
      <div>
        <label for="border"><span data-vi="Độ dày viền">Border width</span><output id="border-out" for="border"></output></label>
        <input id="border" type="range" class="form-range" min="4" max="26" value="10">
      </div>
      <div>
        <label for="radius"><span data-vi="Bo góc">Corner radius</span><output id="radius-out" for="radius"></output></label>
        <input id="radius" type="range" class="form-range" min="0" max="45" value="10">
      </div>
      <div>
        <label for="fray"><span data-vi="Độ sờn mép">Worn edges</span><output id="fray-out" for="fray"></output></label>
        <input id="fray" type="range" class="form-range" min="0" max="100" value="35">
      </div>
    </div>
  </div>
</main>

</body>
</html>
