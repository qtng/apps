<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal generator | Chunom.org</title>
  <meta name="description" content="Make a seal (印章) of Chữ Nôm characters in the fonts of chunom.org and download it as a PNG.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://qatt.org/css/site.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <script src="https://qatt.org/js/navigation.js"></script>
  <script defer src="/chunom/js/ime.js"></script>
  <script defer src="/apps/seals/seal.js"></script>
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    /* the header of the pages of qatt.org and the Chunom site (.hero): the look of the theme "classic"; other themes override it */
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    @media (max-width: 575.98px) {
      .hero { padding-top: 1rem !important; padding-bottom: .6rem !important; margin-bottom: .8rem !important; }
      .hero .han { letter-spacing: .3em; margin-bottom: .2rem !important; }
      .hero h1 { margin-bottom: 0 !important; }
      .hero .lead { display: none; }
    }

    /* the layout: the seal, then the settings; side by side from 992px, both columns of the same height */
    main { max-width: 34rem; margin: 0 auto; padding: 0 .75rem 2rem; }
    .layout { display: grid; gap: 1rem; }
    @media (min-width: 992px) {
      main { max-width: 64rem; }
      .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5rem; }
      .preview { display: flex; }
      .preview .stage { flex: 1; }
    }
    .card-box { background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }

    /* the seal on rice paper (in every theme: black ink must stay visible in a dark theme) */
    .preview { padding: 0; overflow: hidden; }   /* the paper fills the card, its corners are those of the card (of the theme) */
    .stage { display: flex; align-items: center; justify-content: center; min-height: 14rem; padding: 1rem;
      background-color: #faf7f2; background-image: radial-gradient(#e5dec9 1px, transparent 1px); background-size: 16px 16px; }
    .stage canvas { display: block; width: 100%; max-width: 17rem; height: auto; max-height: 26rem; object-fit: contain; }
    @media (min-width: 992px) { .stage canvas { max-width: 20rem; max-height: 32rem; } }

    /* the settings: three panels, each a list of rows (the name on the left, the control on the right), then the download */
    .settings { display: grid; gap: 1rem; }
    .settings .card-box { padding: 0 1rem; }
    .setting { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); align-items: center; gap: .75rem; min-height: 3.4rem; padding: .55rem 0; }
    .setting > .name { font-size: .875rem; font-weight: 600; color: var(--muted); }
    .setting.range { grid-template-columns: 6.5rem minmax(0, 1fr) 3.4rem; }
    .setting.range output { text-align: right; font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .setting .form-range { display: block; }
    /* narrow phones: a narrower name column; the field and the font list need the width, so their name goes above them */
    @media (max-width: 399.98px) {
      .setting { grid-template-columns: 5rem minmax(0, 1fr); gap: .6rem; }
      .setting.range { grid-template-columns: 5rem minmax(0, 1fr) 3rem; }
      .setting.stack { grid-template-columns: minmax(0, 1fr); gap: .35rem; }
    }

    #text { font-size: 1.5rem; letter-spacing: .08em; }
    #text::placeholder { font-size: .95rem; letter-spacing: normal; }
    .filler { gap: .4rem; cursor: pointer; }
    .filler .form-check-input { margin: 0; cursor: pointer; }
    .han-l { font-family: var(--font-cjk), serif; font-size: 1.1rem; line-height: 1; font-style: normal; text-transform: none; letter-spacing: normal; }
    .seg { display: flex; width: 100%; }
    .seg .btn { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
    .btn-check:checked + .btn-quiet { --bs-btn-active-bg: color-mix(in srgb, var(--accent) 14%, transparent); --bs-btn-active-border-color: var(--accent); --bs-btn-active-color: var(--accent); }
    .swatches { display: flex; flex-wrap: wrap; gap: .6rem; }
    .swatch { display: inline-block; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); cursor: pointer; }
    .btn-check:checked + .swatch { outline: 2px solid var(--ink); outline-offset: 2px; }
    .btn-check:focus-visible + .swatch { outline: 2px dashed var(--accent); outline-offset: 2px; }
    .form-range::-webkit-slider-thumb { background: var(--accent); }
    .form-range::-moz-range-thumb { background: var(--accent); }
    @media (max-width: 359.98px) { .seg .word { display: none; } .swatches { gap: .45rem; } .swatch { width: 1.55rem; height: 1.55rem; } }   /* the smallest phones: 朱 白 and the arrows only, smaller dots */
  </style>
</head>
<body>

<header class="hero pt-4 pb-3 mb-3 mb-lg-4">
  <div class="container text-center">
    <div class="han mb-1">印章</div>
    <h1 class="mb-2" data-vi="Tạo con dấu">Seal generator</h1>
    <p class="lead mx-auto mb-0" data-vi="Khắc một con dấu bằng chữ Nôm và tải nó về dưới dạng PNG.">Carve a seal of Chữ Nôm characters and download it as a PNG.</p>
  </div>
</header>

<main class="layout">
  <!-- the seal -->
  <div class="card-box preview">
    <div class="stage">
      <canvas id="seal" width="600" height="600" role="img" aria-label="Seal" data-vi-aria-label="Con dấu"></canvas>
    </div>
  </div>

  <div class="settings">
    <!-- the text: the characters (Telex and the candidates of js/ime.js; a space between two characters is an empty cell) and the font -->
    <section class="card-box" aria-label="Text" data-vi-aria-label="Chữ">
      <div class="setting stack">
        <label for="text" class="name" data-vi="Chữ">Characters</label>
        <div class="input-group" id="text-group">
          <input id="text" type="text" class="form-control" value="𡦂喃麪𢶒" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Type Vietnamese" data-vi-placeholder="Gõ tiếng Việt"
                 title="Telex, then pick the Nôm; a space between two characters leaves a cell empty" data-vi-title="Telex, rồi chọn chữ Nôm; dấu cách giữa hai chữ để trống một ô">
          <label class="input-group-text filler" id="filler-box" title="Fill an odd number with 印" data-vi-title="Thêm 印 khi số chữ lẻ">
            <input class="form-check-input" type="checkbox" id="filler" checked><span class="han-l">印</span>
          </label>
        </div>
      </div>
      <div class="setting stack">
        <label for="font" class="name" data-vi="Phông chữ">Font</label>
        <div class="input-group">
          <button id="font-prev" type="button" class="btn btn-quiet" title="Previous font" data-vi-title="Phông trước"><i class="bi bi-chevron-left"></i></button>
          <select id="font" class="form-select"></select>
          <button id="font-next" type="button" class="btn btn-quiet" title="Next font" data-vi-title="Phông sau"><i class="bi bi-chevron-right"></i></button>
        </div>
      </div>
    </section>

    <!-- the look: carving, reading order, ink -->
    <section class="card-box" aria-label="Look" data-vi-aria-label="Kiểu dáng">
      <div class="setting">
        <span class="name" id="style-name" data-vi="Kiểu khắc">Carving</span>
        <div class="btn-group seg" role="radiogroup" aria-labelledby="style-name">
          <input type="radio" class="btn-check" name="style" id="style-relief" value="relief" checked>
          <label class="btn btn-quiet btn-sm" for="style-relief" title="Red characters (朱文)" data-vi-title="Chữ đỏ (chu văn)"><span class="han-l">朱</span><span class="word" data-vi="Đỏ">Red</span></label>
          <input type="radio" class="btn-check" name="style" id="style-intaglio" value="intaglio">
          <label class="btn btn-quiet btn-sm" for="style-intaglio" title="White characters (白文)" data-vi-title="Chữ trắng (bạch văn)"><span class="han-l">白</span><span class="word" data-vi="Trắng">White</span></label>
        </div>
      </div>
      <div class="setting">
        <span class="name" id="order-name" data-vi="Thứ tự đọc">Reading</span>
        <div class="btn-group seg" role="radiogroup" aria-labelledby="order-name">
          <input type="radio" class="btn-check" name="order" id="order-col" value="columns" checked>
          <label class="btn btn-quiet btn-sm" for="order-col" title="In columns, from the right" data-vi-title="Theo cột, từ phải"><i class="bi bi-arrow-down"></i><span class="word" data-vi="Cột">Columns</span></label>
          <input type="radio" class="btn-check" name="order" id="order-row" value="rows">
          <label class="btn btn-quiet btn-sm" for="order-row" title="In rows, from the left" data-vi-title="Theo hàng, từ trái"><i class="bi bi-arrow-right"></i><span class="word" data-vi="Hàng">Rows</span></label>
        </div>
      </div>
      <div class="setting">
        <span class="name" id="ink-name" data-vi="Màu mực">Ink</span>
        <div class="swatches" role="radiogroup" aria-labelledby="ink-name">
          <input type="radio" class="btn-check" name="ink" id="ink-1" value="#c8281e" checked><label class="swatch" style="--c: #c8281e" for="ink-1" title="Cinnabar" data-vi-title="Chu sa"><span class="visually-hidden" data-vi="Chu sa">Cinnabar</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-2" value="#a81c14"><label class="swatch" style="--c: #a81c14" for="ink-2" title="Carmine" data-vi-title="Đỏ thẫm"><span class="visually-hidden" data-vi="Đỏ thẫm">Carmine</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-3" value="#d9381e"><label class="swatch" style="--c: #d9381e" for="ink-3" title="Vermilion" data-vi-title="Đỏ son"><span class="visually-hidden" data-vi="Đỏ son">Vermilion</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-4" value="#1f2937"><label class="swatch" style="--c: #1f2937" for="ink-4" title="Black" data-vi-title="Đen"><span class="visually-hidden" data-vi="Đen">Black</span></label>
          <input type="radio" class="btn-check" name="ink" id="ink-5" value="#003153"><label class="swatch" style="--c: #003153" for="ink-5" title="Prussian blue" data-vi-title="Xanh Phổ"><span class="visually-hidden" data-vi="Xanh Phổ">Prussian blue</span></label>
        </div>
      </div>
    </section>

    <!-- the proportions and the wear -->
    <section class="card-box" aria-label="Details" data-vi-aria-label="Chi tiết">
      <div class="setting range">
        <label for="scale" class="name" data-vi="Cỡ chữ">Size</label>
        <input id="scale" type="range" class="form-range" min="65" max="115" value="100">
        <output id="scale-out" for="scale"></output>
      </div>
      <div class="setting range">
        <label for="border" class="name" data-vi="Viền">Border</label>
        <input id="border" type="range" class="form-range" min="4" max="26" value="10">
        <output id="border-out" for="border"></output>
      </div>
      <div class="setting range">
        <label for="radius" class="name" data-vi="Bo góc">Corners</label>
        <input id="radius" type="range" class="form-range" min="0" max="45" value="10">
        <output id="radius-out" for="radius"></output>
      </div>
      <div class="setting range">
        <label for="fray" class="name" data-vi="Độ sờn">Wear</label>
        <input id="fray" type="range" class="form-range" min="0" max="100" value="35">
        <output id="fray-out" for="fray"></output>
      </div>
    </section>

    <button id="download" type="button" class="btn btn-cinnabar btn-pill btn-lg w-100"><i class="bi bi-download"></i> <span data-vi="Tải PNG">Download PNG</span></button>
  </div>
</main>

</body>
</html>
