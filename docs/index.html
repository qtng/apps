<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Apps | Chunom.org</title>
  <meta name="description" content="The apps of chunom.org: Nôm Notes and the seal generator.">
  <link rel="icon" href="notes/icons/icon-192.png">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://qatt.org/css/site.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <script src="https://qatt.org/js/navigation.js"></script>
  <!--
    The overview of the apps of chunom.org/apps/. Every app has a folder of its own:
      a web tool:  <app>/index.html is the tool (with the look of the site), e.g. seals/
      a PWA:       <app>/index.html is the landing page, <app>/app.html the app (manifest, service worker), e.g. notes/
      a download:  the link goes to the file itself
  -->
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --muted: #7b6c58; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    main { max-width: 62rem; margin: 0 auto; padding: 0 1rem 3rem; }
    .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; margin: 0; padding: 0; list-style: none; }
    .app { position: relative; display: grid; grid-template-columns: 4rem 1fr; gap: .4rem 1rem; align-items: start; padding: 1.1rem 1.2rem;
      background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    .app .icon { grid-row: span 3; width: 4rem; height: 4rem; border-radius: 22%; box-shadow: 0 .2rem .5rem rgba(60, 40, 20, .2); }
    .app .glyph { display: grid; place-items: center; background: var(--accent); color: #fff; font-family: var(--font-cjk), serif; font-size: 2.3rem; line-height: 1; }
    .app h2 { font-size: 1.25rem; margin: 0; }
    .app h2 a { color: inherit; text-decoration: none; }
    .app h2 a::after { content: ""; position: absolute; inset: 0; }   /* the whole card is the link */
    .app p { margin: 0; color: #4a3d30; }
    .app .kind { font-size: .85rem; color: var(--muted); }
    .app .kind i { margin-right: .3rem; }
    .app:hover { border-color: #d4c3a0; }
  </style>
</head>
<body>
<header class="hero pt-4 pt-sm-5 pb-4 mb-4">
  <div class="container text-center">
    <div class="han mb-2">用</div>
    <h1 class="mb-3">Apps</h1>
    <p class="lead mx-auto mb-0" data-vi="Các ứng dụng cho chữ Nôm, dùng ngay trong trình duyệt.">Apps for Chữ Nôm, right in your browser.</p>
  </div>
</header>
<main>
  <ul class="apps">
    <li class="app">
      <img class="icon" src="notes/icons/icon-192.png" width="64" height="64" alt="">
      <h2><a href="notes/">Nôm Notes</a></h2>
      <p data-vi="Ghi chú và tài liệu bằng chữ Nôm, theo hàng ngang hoặc cột dọc.">Notes and documents in Chữ Nôm, horizontal or vertical.</p>
      <span class="kind"><i class="bi bi-download"></i><span data-vi="Cài được, chạy khi không có mạng">Installable, works offline</span></span>
    </li>
    <li class="app">
      <span class="icon glyph" aria-hidden="true">印</span>
      <h2><a href="seals/" data-vi="Tạo con dấu">Seal generator</a></h2>
      <p data-vi="Khắc chữ Nôm thành con dấu và tải về dạng PNG.">Carve a seal of Chữ Nôm characters and download it as a PNG.</p>
      <span class="kind"><i class="bi bi-globe2"></i><span data-vi="Trong trình duyệt">In the browser</span></span>
    </li>
  </ul>
</main>
</body>
</html>
